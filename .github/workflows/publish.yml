name: Publish image

# Builds and pushes the image docker-compose.yml pulls
# (ghcr.io/mintplayer/codecoverage:master).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Coverage/Dockerfile
          push: true
          tags: |
            ghcr.io/mintplayer/codecoverage:master
            ghcr.io/mintplayer/codecoverage:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
