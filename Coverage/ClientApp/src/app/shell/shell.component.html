<bs-shell [state]="shellState()" [breakpoint]="'md'" (statechange)="onShellToggle($event)">
  <div *bsShellTopbar class="w-100 bg-dark d-flex align-items-center">
    <bs-navbar-toggler [state]="isSidebarVisible()"
                       (stateChange)="toggleSidebar($event)">
    </bs-navbar-toggler>
    <div class="ms-auto me-3 d-flex align-items-center gap-2">
      @if (lang.languages() | keyvalue; as langs) {
        @if (langs.length > 1) {
          <bs-select [ngModel]="lang.language()"
                     (ngModelChange)="lang.setLanguage($event)">
            @for (l of langs; track l.key) {
              <option [ngValue]="l.key">{{ l.value | resolveTranslation }}</option>
            }
          </bs-select>
        }
      }
      @if (authService.user()?.isAuthenticated) {
        <span class="text-light">{{ authService.user()?.userName }}</span>
        <button class="btn btn-outline-light btn-sm" (click)="logout()">{{ 'auth.logout' | t }}</button>
      } @else {
        <button class="btn btn-outline-light btn-sm" (click)="loginWithGitHub()">
          <i class="bi bi-github"></i> {{ 'app.signInWithGitHub' | t }}
        </button>
      }
    </div>
  </div>
  <nav bsShellSidebar class="sidebar-inner text-light p-2">
    <h5 class="p-3 border-bottom">{{ 'app.title' | t }}</h5>
    <a routerLink="/home"
       routerLinkActive="active"
       (click)="onMenuItemClick()"
       class="d-block px-3 py-2 text-light text-decoration-none nav-link">
      <i class="bi bi-house"></i>
      <span class="ms-2">{{ 'app.home' | t }}</span>
    </a>
  </nav>

  <main class="p-4">
    <router-outlet />
  </main>
</bs-shell>
